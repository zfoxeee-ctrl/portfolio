<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--bg:#0b0b0e;--panel:#131318;--panel2:#1a1a21;--line:rgba(255,255,255,.08);--text:#f2f2f5;--muted:#9a9aa6;--accent:#7c5cff;--danger:#e5484d;--ok:#2fb677;--side:250px;font-family:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:500;font-size:.92rem;transition:.2s}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.82rem}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);font-size:1.2rem}

/* gate / login */
.gate{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:20px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-body{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;display:grid;gap:14px}
.login-card form{display:grid;gap:14px}
.msg{color:#ff9b9b;min-height:1.3em;font-size:.9rem}

/* layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px}
.side-brand{font-weight:700;font-size:1.1rem;padding:6px 12px 18px}
#sideNav{display:grid;gap:4px;flex:1;align-content:start}
#sideNav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:.95rem}
#sideNav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
#sideNav a.active{background:color-mix(in srgb,var(--accent) 22%,transparent);color:#fff}
.side-foot{display:grid;gap:10px;padding:10px 4px 0;font-size:.9rem}
.pill{background:var(--accent);color:#fff;font-size:.72rem;padding:1px 8px;border-radius:999px}
.content{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,14,.9);backdrop-filter:blur(10px);z-index:5}
.topbar h1{font-size:1.3rem}
.topbar .icon-btn{display:none}
#main{padding:24px;max-width:1100px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:19}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:20;width:var(--side);transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:none}
  .topbar .icon-btn{display:block}
  #main{padding:16px}
}

/* ui parts */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{display:block;font-size:1.9rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.panel h2{font-size:1.05rem;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow small{color:var(--muted)}
.row img.t{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media(max-width:620px){.row{flex-wrap:wrap}.row img.t{width:100%}.actions{width:100%;justify-content:flex-start}}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);margin-right:4px}
.badge.ok{background:rgba(47,182,119,.18);color:#6ee7a0}
.badge.feat{background:rgba(124,92,255,.22);color:#c4b5ff}
.empty{text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.err-box{border:1px solid rgba(229,72,77,.5);background:rgba(229,72,77,.08);border-radius:12px;padding:16px;display:grid;gap:10px;justify-items:start}

/* forms */
.form{display:grid;gap:14px}
.form .two{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:620px){.form .two{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-size:.85rem;font-weight:500;color:var(--muted)}
label.check{display:flex;align-items:center;gap:10px;color:var(--text)}
input,textarea,select{width:100%;background:#0c0c10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input[type=color]{height:42px;padding:4px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
.preview{width:100%;max-width:360px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;border:1px solid var(--line)}
.preview.sq{aspect-ratio:1;max-width:160px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.hint{font-size:.8rem;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(100%,560px);max-height:92vh;overflow:auto;display:grid;gap:16px}
.dialog.wide{width:min(100%,640px)}
.dialog h3{font-size:1.15rem}
.row.end,.end{justify-content:flex-end;display:flex;gap:10px}
details.msg-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.msg-item.unread{border-color:var(--accent)}
details.msg-item summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none}
details.msg-item p{margin:12px 0;white-space:pre-wrap;word-break:break-word}

#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:grid;gap:8px;width:min(92vw,380px)}
.toast{padding:12px 16px;border-radius:12px;background:#1b1b22;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.3s}
.toast.success{border-color:var(--ok)}.toast.error{border-color:var(--danger)}.toast.out{opacity:0;transform:translateY(8px)}

</style>
</head>
<body>
  <div id="gate" class="gate"><div class="spinner"></div><p class="muted">Checking access…</p></div>

  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="side-brand">Dashboard</div>
      <nav id="sideNav">
        <a href="#overview" data-s="overview">Overview</a>
        <a href="#portfolio" data-s="portfolio">Manage Portfolio</a>
        <a href="#categories" data-s="categories">Manage Categories</a>
        <a href="#services" data-s="services">Manage Services</a>
        <a href="#about" data-s="about">About Me</a>
        <a href="#messages" data-s="messages">Messages <span id="unread" class="pill" hidden></span></a>
        <a href="#settings" data-s="settings">Website Settings</a>
      </nav>
      <div class="side-foot">
        <a class="muted" href="./" target="_blank" rel="noopener">View site ↗</a>
        <button id="logout" class="btn ghost">Logout</button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <div class="content">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
        <h1 id="pageTitle">Overview</h1>
      </header>
      <main id="main"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
// Supabase configuration (public values only — the publishable key is safe in the browser
// because every table is protected by Row Level Security. NEVER put a secret/service_role key here.)

const SUPABASE_KEY = "sb_publishable_Esvf9SZsqq9cB580Zx7ZmA_-ul7QH0V";

const supabaseClient = window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

</script>
  <script>
// Small shared helpers (public site + admin)
const U = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // only http(s) links are ever rendered as href/src
  const safeUrl = (u) => {
    try { const x = new URL(String(u || '').trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; }
    catch { return ''; }
  };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const slugify = (s) => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'item';
  const fmtDate = (d) => new Date(d).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  function toast(msg, type = 'success') {
    let box = $('#toasts');
    if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
    const t = document.createElement('div');
    t.className = 'toast ' + type; t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, type === 'error' ? 6000 : 3500);
  }
  function errMsg(e) {
    const m = (e && (e.message || e.error_description)) || String(e || 'Unknown error');
    if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Cannot reach Supabase. Check your connection and the project URL in supabase-config.js.';
    return m;
  }
  return { $, $$, esc, safeUrl, debounce, slugify, fmtDate, toast, errMsg };
})();

</script>
  <script>
(() => {
  'use strict';
  const { $, $$, esc, safeUrl, slugify, fmtDate, toast, errMsg } = U;
  const sb = supabaseClient;
  const BASE = location.pathname.replace(/\/admin(\/.*)?$/, '');
  const LOGIN_URL = 'login.html';
  const BUCKET = 'portfolio-images';
  const main = $('#main');
  const TITLES = { overview: 'Overview', portfolio: 'Manage Portfolio', categories: 'Manage Categories', services: 'Manage Services', about: 'About Me', messages: 'Messages', settings: 'Website Settings' };
  const SOCIALS = { instagram: 'Instagram', youtube: 'YouTube', twitter: 'X / Twitter', tiktok: 'TikTok', behance: 'Behance', discord: 'Discord' };

  /* ---------------- helpers ---------------- */
  const loading = () => '<div class="gate" style="min-height:240px"><div class="spinner"></div></div>';
  const errBox = (e, retry) => {
    main.innerHTML = `<div class="err-box" role="alert"><b>Something went wrong</b><span>${esc(errMsg(e))}</span><button class="btn" id="retry">Try again</button></div>`;
    $('#retry').onclick = retry;
  };
  // Throws if Supabase returned an error OR if RLS silently affected 0 rows.
  const must = ({ data, error }, needRows = false) => {
    if (error) throw error;
    if (needRows && (!data || (Array.isArray(data) && !data.length))) throw new Error('Not allowed or item no longer exists.');
    return data;
  };
  const confirmDialog = (message, okText = 'Delete') => new Promise((res) => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><p>${esc(message)}</p><div class="end"><button class="btn" data-x="0">Cancel</button><button class="btn danger" data-x="1">${esc(okText)}</button></div></div>`;
    o.addEventListener('click', (e) => { const b = e.target.closest('[data-x]'); if (b || e.target === o) { o.remove(); res(b ? b.dataset.x === '1' : false); } });
    document.body.appendChild(o); $('[data-x="0"]', o).focus();
  });
  function modal(title, body, wide) {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="dialog${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}</div>`;
    const close = () => o.remove();
    o.addEventListener('mousedown', (e) => { if (e.target === o) close(); });
    document.addEventListener('keydown', function k(e) { if (!o.isConnected) return document.removeEventListener('keydown', k); if (e.key === 'Escape') close(); });
    document.body.appendChild(o);
    return { el: o, close };
  }
  const guard = async (btn, fn) => {
    const t = btn && btn.textContent; if (btn) { btn.disabled = true; }
    try { return await fn(); } catch (e) { console.error(e); toast(errMsg(e), 'error'); }
    finally { if (btn) { btn.disabled = false; btn.textContent = t; } }
  };

  /* ---------------- images ---------------- */
  const ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];
  const MAX_INPUT = 15 * 1024 * 1024;  // before optimization
  const MAX_OUTPUT = 5 * 1024 * 1024;  // bucket limit
  async function optimize(file, maxW) {
    if (!ALLOWED.includes(file.type)) throw new Error('Only JPEG, PNG or WebP images are allowed.');
    if (file.size > MAX_INPUT) throw new Error('Image is too large (max 15 MB).');
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxW / bmp.width);
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const toBlob = (t, q) => new Promise((r) => c.toBlob(r, t, q));
    let blob = await toBlob('image/webp', 0.88);
    if (!blob || blob.type !== 'image/webp') blob = await toBlob('image/jpeg', 0.9);
    if (!blob) throw new Error('Could not process the image.');
    if (blob.size > MAX_OUTPUT) { blob = await toBlob('image/webp', 0.7) || blob; }
    if (blob.size > MAX_OUTPUT) throw new Error('Image is still over 5 MB after optimization.');
    return blob;
  }
  async function uploadImage(file, folder, maxW, onProgress) {
    const blob = await optimize(file, maxW);
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Session expired. Please sign in again.');
    await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
      x.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
      x.setRequestHeader('apikey', SUPABASE_KEY);
      x.setRequestHeader('Content-Type', blob.type);
      x.setRequestHeader('cache-control', 'max-age=31536000');
      x.upload.onprogress = (e) => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
      x.onload = () => {
        if (x.status < 300) return resolve();
        let m = 'Upload failed (' + x.status + ').'; try { m = JSON.parse(x.responseText).message || m; } catch { /* ignore */ }
        reject(new Error(m));
      };
      x.onerror = () => reject(new Error('Network error during upload.'));
      x.send(blob);
    });
    return { path, url: sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl };
  }
  async function removeByUrl(url) {
    if (!url) return;
    const marker = `/${BUCKET}/`; const i = url.indexOf(marker);
    if (i < 0) return;
    const path = decodeURIComponent(url.slice(i + marker.length).split('?')[0]);
    const { error } = await sb.storage.from(BUCKET).remove([path]);
    if (error) console.warn('Could not delete old image', error);
  }
  // wires <input type=file> + preview
  function imagePicker(root, imgSel, fileSel) {
    const f = $(fileSel, root), img = $(imgSel, root);
    f.addEventListener('change', () => {
      const file = f.files[0]; if (!file) return;
      if (!ALLOWED.includes(file.type)) { toast('Only JPEG, PNG or WebP images are allowed.', 'error'); f.value = ''; return; }
      img.src = URL.createObjectURL(file); img.hidden = false;
    });
  }
  const progressBar = (root) => { const bar = $('.progress', root), i = $('i', bar); return (p) => { bar.hidden = false; i.style.width = Math.round(p * 100) + '%'; }; };

  /* ---------------- ordering ---------------- */
  async function move(table, list, idx, dir) {
    const j = idx + dir; if (j < 0 || j >= list.length) return;
    const arr = list.slice(); [arr[idx], arr[j]] = [arr[j], arr[idx]];
    const changes = arr.map((it, n) => ({ it, n })).filter(({ it, n }) => it.display_order !== n);
    await Promise.all(changes.map(({ it, n }) => sb.from(table).update({ display_order: n }).eq('id', it.id).select('id').then((r) => must(r, true))));
  }

  /* ---------------- OVERVIEW ---------------- */
  async function overview() {
    main.innerHTML = loading();
    try {
      const cnt = (t, f) => { let q = sb.from(t).select('id', { count: 'exact', head: true }); if (f) q = f(q); return q.then((r) => { if (r.error) throw r.error; return r.count || 0; }); };
      const [total, pub, cats, svcs, msgs, unread, recent] = await Promise.all([
        cnt('projects'), cnt('projects', (q) => q.eq('is_published', true)), cnt('categories'), cnt('services'), cnt('messages'),
        cnt('messages', (q) => q.eq('is_read', false)),
        sb.from('projects').select('id,title,image_url,is_published,created_at').order('created_at', { ascending: false }).limit(5).then(must)
      ]);
      main.innerHTML = `
        <div class="cards">
          <div class="stat"><b>${total}</b><span>Portfolio projects</span></div>
          <div class="stat"><b>${pub}</b><span>Published</span></div>
          <div class="stat"><b>${cats}</b><span>Categories</span></div>
          <div class="stat"><b>${svcs}</b><span>Services</span></div>
          <div class="stat"><b>${msgs}</b><span>Messages (${unread} unread)</span></div>
        </div>
        <div class="panel"><h2>Recently added projects</h2>
          ${recent.length ? `<div class="list">${recent.map((p) => `<div class="row"><img class="t" src="${esc(safeUrl(p.image_url))}" alt="" loading="lazy"><div class="grow"><b>${esc(p.title)}</b><small>${fmtDate(p.created_at)}</small></div><span class="badge ${p.is_published ? 'ok' : ''}">${p.is_published ? 'Published' : 'Draft'}</span></div>`).join('')}</div>` : '<div class="empty">No projects yet. <a href="#portfolio" class="muted"><u>Add your first one</u></a>.</div>'}
        </div>`;
    } catch (e) { errBox(e, overview); }
  }

  /* ---------------- PORTFOLIO ---------------- */
  let projects = [];
  async function portfolio() {
    main.innerHTML = loading();
    try {
      const [p, c] = await Promise.all([
        sb.from('projects').select('*, categories(name)').order('display_order').order('created_at', { ascending: false }).then(must),
        sb.from('categories').select('*').order('name').then(must)
      ]);
      projects = p;
      main.innerHTML = `
        <div class="toolbar"><span class="muted">${p.length} project${p.length === 1 ? '' : 's'}</span><button class="btn primary" id="addP">+ Add project</button></div>
        ${p.length ? `<div class="list">${p.map((x, i) => `
          <div class="row" data-id="${x.id}">
            <img class="t" src="${esc(safeUrl(x.image_url))}" alt="" loading="lazy">
            <div class="grow"><b>${esc(x.title)}</b>
              <small>${x.categories ? esc(x.categories.name) : 'No category'}</small><br>
              <span class="badge ${x.is_published ? 'ok' : ''}">${x.is_published ? 'Published' : 'Unpublished'}</span>${x.is_featured ? '<span class="badge feat">★ Featured</span>' : ''}
            </div>
            <div class="actions">
              <button class="btn sm" data-a="up" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
              <button class="btn sm" data-a="down" ${i === p.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>
              <button class="btn sm" data-a="pub">${x.is_published ? 'Unpublish' : 'Publish'}</button>
              <button class="btn sm" data-a="feat">${x.is_featured ? 'Unfeature' : 'Feature'}</button>
              <button class="btn sm" data-a="edit">Edit</button>
              <button class="btn sm danger" data-a="del">Delete</button>
            </div>
          </div>`).join('')}</div>` : '<div class="empty">No projects yet.</div>'}`;
      $('#addP').onclick = () => projectForm(null, c);
      $$('.row[data-id]', main).forEach((row) => {
        const idx = p.findIndex((x) => x.id === row.dataset.id), item = p[idx];
        row.addEventListener('click', (e) => {

  async function mfaCard() {
    const box = $('#mfa'); if (!box) return;
    const { data, error } = await sb.auth.mfa.listFactors();
    if (error) { box.innerHTML = `<h2>Two-factor authentication</h2><p class="muted">Not available: ${esc(errMsg(error))}</p>`; return; }
    const verified = (data.totp || []).filter((x) => x.status === 'verified');
    if (verified.length) {
      box.innerHTML = `<h2>Two-factor authentication</h2><p>✅ Enabled (authenticator app).</p><div style="margin-top:12px"><button class="btn danger sm" id="mfaOff">Disable</button></div>`;
      $('#mfaOff').onclick = (e) => guard(e.target, async () => {
        if (!(await confirmDialog('Disable two-factor authentication?', 'Disable'))) return;
        const { error: er } = await sb.auth.mfa.unenroll({ factorId: verified[0].id }); if (er) throw er; toast('2FA disabled.'); mfaCard();
      });
      return;
    }
    box.innerHTML = `<h2>Two-factor authentication</h2><p class="muted">Protect your account with an authenticator app (Google Authenticator, Authy, 1Password…).</p><div style="margin-top:12px"><button class="btn primary sm" id="mfaOn">Enable 2FA</button></div><div id="mfaStep"></div>`;
    $('#mfaOn').onclick = (e) => guard(e.target, async () => {
      for (const f of (data.totp || []).filter((x) => x.status !== 'verified')) await sb.auth.mfa.unenroll({ factorId: f.id });
      const { data: en, error: er } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Authenticator ' + Date.now() }); if (er) throw er;
      $('#mfaStep').innerHTML = `<div class="form" style="margin-top:16px"><p>Scan this QR code, then enter the 6-digit code.</p><img src="${esc(en.totp.qr_code)}" alt="2FA QR code" width="180" height="180" style="background:#fff;padding:8px;border-radius:10px"><p class="hint">Or enter this key manually: <code>${esc(en.totp.secret)}</code></p><label>Code <input id="mfaCode" inputmode="numeric" maxlength="6"></label><div><button class="btn primary sm" id="mfaVerify">Verify &amp; enable</button></div></div>`;
      $('#mfaVerify').onclick = (ev) => guard(ev.target, async () => {
        const { error: ve } = await sb.auth.mfa.challengeAndVerify({ factorId: en.id, code: $('#mfaCode').value.trim() }); if (ve) throw ve; toast('2FA enabled.'); mfaCard();
      });
    });
  }

  async function signOut() { try { await sb.auth.signOut(); } finally { location.replace(LOGIN_URL); } }

  async function boot() {
    const gate = $('#gate');
    const deny = (html) => { gate.innerHTML = html; };
    if (!sb) return deny('<p>Supabase library failed to load. Check your connection.</p>');
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return location.replace(LOGIN_URL);
      const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2') return location.replace(LOGIN_URL);
      const { data: ok, error } = await sb.rpc('is_admin');
      if (error) throw error;
      if (ok !== true) {
        deny('<h2>Access denied</h2><p class="muted">This account is not authorized to administer the site.</p><button class="btn" id="out">Sign out</button>');
        $('#out').onclick = signOut; return;
      }
    } catch (e) {
      deny(`<h2>Cannot verify access</h2><p class="muted">${esc(errMsg(e))}</p><button class="btn" onclick="location.reload()">Retry</button>`); return;
    }
    gate.hidden = true; $('#app').hidden = false;
    sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.replace(LOGIN_URL); });
    $('#logout').onclick = signOut;
    $('#menuBtn').onclick = () => { $('#sidebar').classList.add('open'); $('#scrim').hidden = false; };
    $('#scrim').onclick = () => { $('#sidebar').classList.remove('open'); $('#scrim').hidden = true; };
    window.addEventListener('hashchange', route);
    // auto-logout after 30 min of inactivity
    let idle; const reset = () => { clearTimeout(idle); idle = setTimeout(signOut, 30 * 60 * 1000); };
    ['click', 'keydown', 'touchstart', 'mousemove'].forEach((ev) => document.addEventListener(ev, reset, { passive: true })); reset();
    updateUnread(); route();
  }
  boot();
})();

</script>
</body>
</html>
